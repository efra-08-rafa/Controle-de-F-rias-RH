appId: mz.ifloma.controleferiasrh
productName: Controle de Férias RH
copyright: IFLOMA
asar: true
files:
  - .next/**
  - public/**
  - app/**
  - components/**
  - lib/**
  - database/**
  - electron/**
  - package.json
  - next.config.js
  - node_modules/next/**
  - node_modules/react/**
  - node_modules/react-dom/**
  - node_modules/better-sqlite3/**
  - node_modules/pg/**
win:
  target:
    - nsis
  artifactName: Controle-de-Ferias-RH-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
