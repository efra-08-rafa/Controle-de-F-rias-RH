name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      DATABASE_MODE: local
      LOCAL_DATABASE_PATH: ./data/ci.sqlite
      SESSION_SECRET: ci-session-secret-for-automated-tests-with-more-than-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Verify standalone
        run: npm run verify:standalone
      - name: Start application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "npm.cmd" -ArgumentList "run","start" -PassThru -WindowStyle Hidden
          Set-Content -Path "$env:RUNNER_TEMP\controle-ferias-server.pid" -Value $p.Id
          for ($i=0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/login | Out-Null; break } catch { Start-Sleep -Seconds 2 }
            if ($i -eq 29) { throw "Servidor não iniciou." }
          }
      - name: API smoke tests
        run: npm run test:api
      - name: Stop application before native rebuild
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\controle-ferias-server.pid"
          if (Test-Path $pidFile) {
            $serverPid = [int](Get-Content $pidFile | Select-Object -First 1)
            Get-Process -Id $serverPid -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process npm -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        run: npx --yes @electron/rebuild@4.0.1 -f -w better-sqlite3
      - name: Verify better-sqlite3 native module
        shell: pwsh
        run: |
          $module = Get-ChildItem "node_modules/better-sqlite3/build/Release/better_sqlite3.node" -File -ErrorAction SilentlyContinue
          if (-not $module) { throw "Módulo nativo better-sqlite3 não foi encontrado." }
          Write-Host "better-sqlite3 nativo preparado para Electron: $($module.FullName)"
          Write-Host "TAMANHO: $([math]::Round($module.Length / 1KB, 2)) KB"
      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/Controle-de-Ferias-RH-Setup-*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Instalador Windows não foi criado." }
          Write-Host "INSTALADOR VALIDADO: $($installer.FullName)"
          Write-Host "TAMANHO: $([math]::Round($installer.Length / 1MB, 2)) MB"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Ferias-RH-Windows
          path: dist/Controle-de-Ferias-RH-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
