name: Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-latest
    env:
      DATABASE_MODE: local
      LOCAL_DATABASE_PATH: ./data/ci.sqlite
      SESSION_SECRET: ci-session-secret-for-automated-tests-with-more-than-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Verify standalone
        run: npm run verify:standalone
      - name: Start application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "npm.cmd" -ArgumentList "run","start" -PassThru -WindowStyle Hidden
          Set-Content -Path "$env:RUNNER_TEMP\controle-ferias-server.pid" -Value $p.Id
          for ($i=0; $i -lt 30; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/login | Out-Null; break } catch { Start-Sleep -Seconds 2 }
            if ($i -eq 29) { throw "Servidor não iniciou." }
          }
      - name: API smoke tests
        run: npm run test:api
      - name: Stop application before native rebuild
        if: always()
        shell: pwsh
        run: |
          $pidFile = "$env:RUNNER_TEMP\controle-ferias-server.pid"
          if (Test-Path $pidFile) {
            $serverPid = [int](Get-Content $pidFile | Select-Object -First 1)
            Get-Process -Id $serverPid -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process npm -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        run: npx --yes @electron/rebuild@4.0.1 -f -w better-sqlite3
      - name: Verify better-sqlite3 native module
        shell: pwsh
        run: |
          $module = Get-ChildItem "node_modules/better-sqlite3/build/Release/better_sqlite3.node" -File -ErrorAction SilentlyContinue
          if (-not $module) { throw "Módulo nativo better-sqlite3 não foi encontrado." }
          Write-Host "better-sqlite3 nativo preparado para Electron: $($module.FullName)"
          Write-Host "TAMANHO: $([math]::Round($module.Length / 1KB, 2)) KB"
      - name: Build Windows portable folder
        run: npx electron-builder --win dir --publish never
      - name: Verify portable application
        shell: pwsh
        run: |
          $appDir = "dist/win-unpacked"
          $exe = Get-ChildItem "$appDir/*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not (Test-Path $appDir)) { throw "Pasta portátil não foi criada: $appDir" }
          if (-not $exe) { throw "Executável da aplicação não foi encontrado dentro da pasta portátil." }
          $resources = Join-Path $appDir "resources/app"
          if (-not (Test-Path (Join-Path $resources "server.js"))) { throw "server.js não foi incluído na aplicação portátil." }
          if (-not (Test-Path (Join-Path $resources "database/sqlite-schema.sql"))) { throw "Schema SQLite não foi incluído na aplicação portátil." }
          Write-Host "APLICAÇÃO PORTÁTIL VALIDADA: $($exe.FullName)"
          Write-Host "TAMANHO DO EXECUTÁVEL: $([math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "PASTA: $appDir"
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: Controle-de-Ferias-RH-Windows-Portable
          path: dist/win-unpacked
          if-no-files-found: error
          retention-days: 14
